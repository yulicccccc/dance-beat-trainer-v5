name: Deploy isolated Dance Beat Trainer Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dance-beat-trainer-v5-production
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: yulicccccc/dance-beat-trainer-v5
  EXPECTED_WORKER: dance-beat-trainer-v5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Safety gate — repository and Worker identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          ACTUAL_WORKER="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(c.name)")"
          test "$ACTUAL_WORKER" = "$EXPECTED_WORKER"
          if grep -RniE 'looptube|dance-beat-pro' wrangler.jsonc .github/workflows; then
            echo 'Forbidden legacy deployment target detected.' >&2
            exit 1
          fi
          echo "Safe deployment target: $ACTUAL_WORKER"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy only the isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.jsonc --name "$EXPECTED_WORKER"

      - name: Deployment summary
        run: |
          {
            echo '## Isolated Worker deployment'
            echo ''
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Worker: \`$EXPECTED_WORKER\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo '- No routes or custom domains are configured.'
          } >> "$GITHUB_STEP_SUMMARY"
