name: Verify and deploy isolated Dance Beat Trainer Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYMENT_STATUS.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dance-beat-trainer-v5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: yulicccccc/dance-beat-trainer-v5
  EXPECTED_WORKER: dance-beat-trainer-v5

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Safety gate — repository and Worker identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

          ACTUAL_WORKER="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(c.name)")"
          IDENTITY_REPOSITORY="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('PROJECT_IDENTITY.json','utf8')); process.stdout.write(c.repository)")"
          IDENTITY_WORKER="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('PROJECT_IDENTITY.json','utf8')); process.stdout.write(c.cloudflareWorker)")"

          test "$ACTUAL_WORKER" = "$EXPECTED_WORKER"
          test "$IDENTITY_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$IDENTITY_WORKER" = "$EXPECTED_WORKER"

          if grep -RniE 'looptube|dance-beat-pro' wrangler.jsonc package.json worker src; then
            echo 'Forbidden legacy deployment target detected in runtime or deployment files.' >&2
            exit 1
          fi

          echo "Safe repository: $GITHUB_REPOSITORY"
          echo "Safe Worker target: $ACTUAL_WORKER"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy only the isolated Worker
        id: deploy
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          echo 'url=' >> "$GITHUB_OUTPUT"
          echo 'reason=unknown' >> "$GITHUB_OUTPUT"

          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Both Cloudflare repository secrets are missing.' >&2
            echo 'reason=missing_api_token_and_account_id' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN is missing.' >&2
            echo 'reason=missing_api_token' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'CLOUDFLARE_ACCOUNT_ID is missing.' >&2
            echo 'reason=missing_account_id' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          OUTPUT="$(npx wrangler deploy --config wrangler.jsonc --name "$EXPECTED_WORKER" 2>&1)"
          STATUS=$?
          printf '%s\n' "$OUTPUT"
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            echo 'reason=deployed' >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$OUTPUT" | grep -qiE 'authentication|authorization|api token|permission|forbidden|unauthorized'; then
            echo 'reason=cloudflare_auth_or_permission_error' >> "$GITHUB_OUTPUT"
          else
            echo 'reason=wrangler_deploy_error' >> "$GITHUB_OUTPUT"
          fi
          exit "$STATUS"

      - name: Record deployment status
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_REASON: ${{ steps.deploy.outputs.reason }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "worker": "dance-beat-trainer-v5",
              "repository": "yulicccccc/dance-beat-trainer-v5",
              "status": os.environ.get("DEPLOY_OUTCOME", "unknown"),
              "reason": os.environ.get("DEPLOY_REASON") or "unknown",
              "url": os.environ.get("DEPLOY_URL") or None,
              "sourceCommit": os.environ.get("SOURCE_COMMIT"),
              "recordedAt": datetime.now(timezone.utc).isoformat(),
          }
          with open("DEPLOYMENT_STATUS.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record deployment status [skip ci]'
            git push origin HEAD:main
          fi

      - name: Fail when deployment failed
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && steps.deploy.outcome != 'success'
        run: exit 1

      - name: Deployment summary
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && steps.deploy.outcome == 'success'
        run: |
          {
            echo '## Isolated Worker deployment'
            echo ''
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Worker: \`$EXPECTED_WORKER\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: \`${{ steps.deploy.outputs.url }}\`"
            echo '- No routes or custom domains are configured.'
          } >> "$GITHUB_STEP_SUMMARY"
